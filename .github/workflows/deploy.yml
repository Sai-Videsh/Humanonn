name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Clean Files
        run: |
          rm -f test.exe
          find . -name "*.pyc" -delete
          find . -name "__pycache__" -type d -exec rm -rf {} +

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Erase git history on the temporary builder VM
          rm -rf .git

          # 2. Re-initialize a fresh git repo with no history
          git init
          git config --global user.email "deploy@github.com"
          git config --global user.name "GitHub Actions"
          git checkout -b main
          git add .
          git commit -m "Clean deploy to Hugging Face"

          # 3. Add remote
          git remote add hf https://videsh24:$HF_TOKEN@huggingface.co/spaces/videsh24/Humanonn

          # 4. Attempt push with 3 retries (to bypass rate limits / transient network errors)
          for i in {1..3}; do
            git push -f hf main && break || {
              echo "Push failed (likely rate-limited), retrying in 15 seconds (Attempt $i/3)..."
              sleep 15
            }
          done

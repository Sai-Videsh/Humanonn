[project]
name = "humanonn"
version = "0.1.0"
description = "CLI-first website quality auditor for vibe-coded design patterns."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.9.0",
    "playwright>=1.44.0",
    "pydantic>=2.7.0",
    "streamlit>=1.36.0",
]

[project.scripts]
humanonn = "humanonn.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Humanonn Fixture</title>
    <style>
      body {
        margin: 0;
        background: radial-gradient(circle at 20% 20%, rgb(139, 92, 246), transparent 30%),
          radial-gradient(circle at 80% 10%, rgb(236, 72, 153), transparent 28%),
          #080812;
        color: white;
        font-family: Inter, sans-serif;
        line-height: 1.35;
      }
      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 80px 24px;
      }
      section {
        padding-top: 65px;
        padding-bottom: 73px;
        border-bottom: 1px solid rgba(255,255,255,.12);
      }
      h1, h2 {
        text-align: center;
      }
      .badge {
        display: block;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0;
      }
      button {
        border: 0;
        border-radius: 9999px;
        padding: 14px 24px;
        background: rgb(139, 92, 246);
        color: white;
        box-shadow: 0 0 42px rgba(139, 92, 246, .55);
      }
      .card {
        border-radius: 28px;
        backdrop-filter: blur(16px);
        background: rgba(255,255,255,.08);
        padding: 24px;
      }
      input {
        outline: none;
        background: #111;
        color: white;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <span class="badge">Now in beta</span>
        <h1>Make launches feel magical</h1>
        <button>Get started</button>
        <button>Learn more</button>
      </section>
      <section class="card">
        <h2>FEATURES</h2>
        <p>Build, ship, and scale with a workflow that keeps every team aligned across the entire product lifecycle without switching tools.</p>
      </section>
      <section class="card">
        <h2>PRICING</h2>
        <input placeholder="Email">
      </section>
    </main>
  </body>
</html>
